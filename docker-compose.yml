services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-YOUR_LOCAL_DB_PASSWORD}
      POSTGRES_DB: finsight
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight -d finsight"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://finsight:${POSTGRES_PASSWORD:-YOUR_LOCAL_DB_PASSWORD}@db:5432/finsight
      SECRET_KEY: ${SECRET_KEY:-YOUR_LOCAL_JWT_SECRET}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      FINSIGHT_MODEL_PATH: /app/ml/artifacts/model.joblib
    volumes:
      - ./ml:/app/ml
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
